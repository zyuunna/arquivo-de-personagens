<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arquivo de Personagens</title>
<style>

:root {
    --paper: #fffaf2;
    --gold: #cda879;
    --gold-dark: #bd8d59;
    --gold-pale: #f2e1c8;
    --ink: #bd8956;
    --line: var(--gold);
}

/* Configurações gerais */
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
    background: var(--paper);
    color: var(--ink);
}

body {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 16px;
}

button {
    font: inherit;
    color: inherit;
    cursor: pointer;
}

/* Página principal */
.page {
    width: min(1180px, 100%);
    margin: 0 auto;
    padding: 18px 1px 30px;
}

/* Layout do perfil */
.profile-layout {
    display: grid;
    grid-template-columns: 280px minmax(0, 1fr);
    gap: 28px;
    align-items: start;
}

/* Coluna do retrato */
.portrait-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    min-width: 0;
}

/* Moldura principal */
.portrait-frame {
 

    height: 116px;
    width: 100%;
    background: url('assets/fullbody-frame.png') center / contain no-repeat;
    padding: 7% 7% 9%;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}


/* Imagem principal */
.portrait-inner {
    width: 100%;
    height: 100%;
    overflow: visible;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
}

.portrait-inner img {
    display: block;
    width: 100%;
    height: 108%;
    object-fit: contain;
    object-position: center bottom;
}

/* Texto provisório da imagem */
.placeholder {
    font-size: 14px;
    text-align: center;
    opacity: 0.75;
    padding: 12px;
    line-height: 1.4;
}

/* Botões Casual e Explorer */
.mode-tabs {
    display: flex;
    justify-content: center;
    gap: 10px;
    width: 100%;
}

.mode-tabs button {
    min-width: 82px;
    padding: 7px 15px;
    border: 1px solid var(--gold-dark);
    background: transparent;
    transition: background 0.15s, color 0.15s;
}

.mode-tabs button.active,
.mode-tabs button:hover {
    background: var(--gold-pale);
}

/* Coluna direita do perfil */
.right-col {
    min-width: 0;
    padding-top: 7px;
}

/* Nome do personagem */
.character-name {
    font-size: clamp(21px, 2.4vw, 30px);
    font-weight: 400;
    margin: 0 0 12px;
    line-height: 1.2;
    overflow-wrap: anywhere;
}

/* Organização das caixas de texto */
.panels {
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-width: 0;
}

/* Estilo compartilhado das molduras de texto */
.data-panel,
.description-panel {
    position: relative;
    width: 100%;
    background-position: center;
    background-size: 100% 100%;
    background-repeat: no-repeat;
    overflow: hidden;
    min-width: 0;
}

/* Caixa de dados */
.data-panel {
    height: 132px;
    background-image: url('assets/data-frame.png');
}

/* Caixa de descrição */
.description-panel {
    height: 206px;
    background-image: url('assets/description-frame.png');
}

/* Títulos das caixas */
.panel-title {
    position: absolute;
    z-index: 2;
    margin: 0;
    font-size: 18px;
    font-weight: 400;
    line-height: 1;
    letter-spacing: 0.04em;
    font-family: Verdana, Geneva, Tahoma, sans-serif;
}

/* Posição do título DADOS */
.data-panel .panel-title {
    top: 3px;
    left: 7%;
    height: 18px;
    display: flex;
    align-items: center;
}

/* Posição do título DESCRIÇÃO */
.description-panel .panel-title {
    top: 5px;
    left: 7%;
    height: 22px;
    display: flex;
    align-items: center;
}

/* Texto dentro das caixas */
.panel-body {
    position: absolute;
    inset: 30px 20px 12px;
    padding: 0;
    overflow: auto;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.45;
    font-size: 16px;
}


/* Texto dos dados */
.data-panel .panel-body {
    inset: 31px 20px 10px;
    overflow: hidden;
    white-space: normal;
}

/* Dados organizados em duas colunas */
.data-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-rows: repeat(3, auto);
    column-gap: 12px;
    row-gap: 9px;
    align-content: center;
    height: 100%;
    font-size: 15px;
    line-height: 1.3;
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
}

.data-item {
    min-width: 0;
    overflow-wrap: anywhere;
}

/* Marca-texto nos títulos */
.data-item mark {
    background-color: #f2dfb8;
    color: #95683f;
    padding: 1px 3px;
    border-radius: 2px;
    font-weight: 600;
}


/* Texto da descrição */
.description-panel .panel-body {
    inset: 50px 20px 12px;
}

/* Seção da galeria */
.gallery-section {
    margin-top: 24px;
    border-top: 1px solid var(--gold-dark);
    padding-top: 17px;
}

/* Título da galeria */
.gallery-heading {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: 0 0 12px;
    font-size: 20px;
    font-weight: 400;
    letter-spacing: 0.04em;
}

.gallery-heading::before,
.gallery-heading::after {
    content: '';
    height: 1px;
    background: var(--gold);
    flex: 1;
}

/* Grade dos personagens: seis colunas */
.cards {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 18px 12px;
    min-width: 0;
    width: 100%;
}

/* Cartão individual */
.character-card {
    border: 0;
    padding: 0;
    background: transparent;
    min-width: 0;
    text-align: center;
}

/* Miniatura e sua moldura */

.thumb {
    height: 116px;
    width: 100%;
    background: url('assets/portrait-frame.png') center / contain no-repeat;
    padding: 7% 7% 9%;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Imagem da miniatura */
.thumb img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

/* Texto provisório da miniatura */
.thumb .placeholder {
    font-size: 12px;
}

/* Nome sob cada personagem */
.card-name {
    display: block;
    margin-top: 4px;
    font-size: 14px;
    overflow-wrap: anywhere;
}

/* Personagem selecionado */
.character-card.selected .card-name {
    font-weight: bold;
    text-decoration: underline;
    text-underline-offset: 3px;
}

.character-card.selected .thumb {
    filter: drop-shadow(0 0 1px var(--gold-dark));
}

/* Observação no rodapé */
.note {
    font-family: Arial, sans-serif;
    font-size: 11px;
    color: #bba080;
    text-align: center;
    margin-top: 18px;
}

/* Telas grandes */
@media (min-width: 900px) {
    .page {
        padding-top: 22px;
    }

    .profile-layout {
        grid-template-columns: 290px minmax(0, 1fr);
        gap: 60px;
    }

    .portrait-frame {
        width: 530px;
        height: 530px;
    }

    .data-panel {
        height: 135px;
    }

    .description-panel {
        height: 280px;
    }

    .thumb {
        height: 125px;
    }
}

/* Telas médias: quatro colunas */
@media (max-width: 800px) {
    .cards {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px 10px;
    }
}

/* Celulares */
@media (max-width: 520px) {
    .page {
        padding: 14px 14px 24px;
    }

    .profile-layout {
        grid-template-columns: minmax(0, 1fr);
        gap: 18px;
    }

    .portrait-frame {
        width: min(260px, 75vw);
        height: min(410px, 118vw);
    }

    .right-col {
        padding-top: 0;
    }

    .character-name {
        text-align: center;
    }

    .data-panel {
        height: 125px;
    }

    .description-panel {
        height: 190px;
    }

    .gallery-section {
        margin-top: 22px;
    }

    .cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px 8px;
    }

    .thumb {
        height: 120px;
    }

    .card-name {
        font-size: 12px;
    }
}

/* MARGENS DO SITE INTEIRO */
body {
    margin: 0;
    padding-left: 90px;
    padding-right: 30px;
    box-sizing: border-box;
}

</style>

let selectedIndex=0, currentMode='casual';
const $=id=>document.getElementById(id);
function addImage(container,src,alt,placeholder){
  container.innerHTML='';
  if(src){const img=document.createElement('img');img.src=src;img.alt=alt;img.onerror=()=>{container.innerHTML='<div class="placeholder">Imagem não encontrada</div>'};container.appendChild(img)}
  else container.innerHTML='<div class="placeholder">'+placeholder+'</div>';
}

function renderCharacterData(data) {
    const container = $('characterData');
    container.innerHTML = '';

    const fields = [
        ['Aniversário', 'aniversario'],
        ['Espécie', 'especie'],
        ['Altura', 'altura'],
        ['Crush', 'crush'],
        ['Ocupação', 'ocupacao'],
        ['Status', 'status']
    ];

    const grid = document.createElement('div');
    grid.className = 'data-grid';

    fields.forEach(([title, key]) => {
        const item = document.createElement('div');
        item.className = 'data-item';

        const mark = document.createElement('mark');
        mark.textContent = title + ':';

        const value = document.createTextNode(
            ' ' + (data && typeof data === 'object' && data[key] != null
                ? data[key]
                : '—')
        );

        item.append(mark, value);
        grid.appendChild(item);
    });

    container.appendChild(grid);
}

function renderProfile(){
  const c = characters[selectedIndex];

if (!c[currentMode]) {
    currentMode = c.casual ? 'casual' : 'explorer';
}

$('characterName').textContent = 'NOME: ' + c.name;
  renderCharacterData(c.data);
  $('characterDescription').textContent=c.description||'texto';
  addImage($('mainPortrait'),c[currentMode],c.name,'EM BREVE');
  document.querySelectorAll('.mode-tabs button').forEach(b => {
    const mode = b.dataset.mode;
    const hasImage = Boolean(c[mode]);

    b.style.display = hasImage ? '' : 'none';
    b.classList.toggle('active', mode === currentMode);
});
  renderCards();
}
function renderCards(){
  const holder=$('cards');holder.innerHTML='';
  characters.forEach((c,index)=>{
    const button=document.createElement('button');button.type='button';button.className='character-card'+(index===selectedIndex?' selected':'');button.setAttribute('aria-label','Selecionar '+c.name);
    const thumb=document.createElement('div');thumb.className='thumb';
    addImage(thumb,c.thumbnail||c.casual,c.name,'OC');
    const label=document.createElement('span');label.className='card-name';label.textContent=c.name;
    button.append(thumb,label);button.addEventListener('click',()=>{selectedIndex=index;currentMode='casual';renderProfile();$('characterName').scrollIntoView({behavior:'smooth',block:'start'})});holder.appendChild(button);
  });
}
document.querySelectorAll('.mode-tabs button').forEach(b=>b.addEventListener('click',()=>{currentMode=b.dataset.mode;renderProfile()}));
renderProfile();
